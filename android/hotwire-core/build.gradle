// Builds the vendored Hotwire Native Android `core` module (see VENDOR.md).
// Included by Expo autolinking as the Gradle project `:hotwire-native-core`
// through the `android.projects` entry in expo-module.config.json.
// expo-module-gradle-plugin supplies the Kotlin plugin, SDK levels and JVM target.
plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'dev.hotwire'
version = '1.3.1'

android {
  namespace 'dev.hotwire.core'

  defaultConfig {
    versionCode 1
    versionName '1.3.1'
  }

  sourceSets {
    main {
      java.srcDirs += 'src/main/kotlin'
    }
  }

  lint {
    abortOnError false
  }
}

// Versions mirror upstream hotwire-native-android core/build.gradle.kts at the vendored
// tag, except kotlin-reflect, which must follow the app's Kotlin plugin version.
dependencies {
  implementation 'org.jetbrains.kotlin:kotlin-reflect'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.1'
  implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.10.1'
  implementation 'com.google.android.material:material:1.12.0'
  implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
  implementation 'androidx.lifecycle:lifecycle-common:2.8.7'
  implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
  implementation 'com.google.code.gson:gson:2.12.1'
  implementation 'com.squareup.okhttp3:okhttp:5.3.2'
  implementation 'com.squareup.okhttp3:okhttp-coroutines:5.3.2'
  implementation 'com.squareup.okhttp3:logging-interceptor:5.3.2'

  api 'androidx.appcompat:appcompat:1.7.0'
  api 'androidx.core:core-ktx:1.16.0'
  api 'androidx.webkit:webkit:1.13.0'
}
