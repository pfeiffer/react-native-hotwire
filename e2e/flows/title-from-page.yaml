appId: dev.hotwire.e2e
name: The screen title is the new page's, never the previous page's
---
- runScript: lib/reset.js
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Home title"
    timeout: 60000
- tapOn: "Push page"
- extendedWaitUntil:
    visible: "Pushed title"
    timeout: 10000
# The iOS back button keeps the previous title as its accessibility label.
- runFlow:
    when:
      platform: Android
    commands:
      - assertNotVisible: "Home title"
- tapOn: "Go back"
- extendedWaitUntil:
    visible: "Home title"
    timeout: 10000
- assertNotVisible: "Pushed title"
