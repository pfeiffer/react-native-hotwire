appId: dev.hotwire.e2e
name: A visit redirected on the same host replaces the pushed screen, rendered from the redirect response
---
- runScript: lib/reset.js
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Home page"
    timeout: 60000
- tapOn: "Redirect to page"
- extendedWaitUntil:
    visible: "Pushed page"
    timeout: 10000
- assertVisible: "Redirected!"
- runScript: lib/counts.js
- assertTrue: ${output.counts['/page'] == 1}
- tapOn: "Go back"
- extendedWaitUntil:
    visible: "Home page"
    timeout: 10000
